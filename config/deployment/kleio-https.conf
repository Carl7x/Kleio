map $http_upgrade $kleio_upgrade_connection {
    default upgrade;
    '' close;
}
log_format kleio_private '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
server {
    listen 443 ssl;
    server_name agent.example.com;
    ssl_certificate /etc/kleio-tls/fullchain.pem;
    ssl_certificate_key /etc/kleio-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KleioTLS:10m;
    access_log /var/log/nginx/kleio.access.log kleio_private;
    error_log /var/log/nginx/kleio.error.log crit;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kleio_upgrade_connection;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cookie_flags ~ secure httponly samesite=strict;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
